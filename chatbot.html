<div id="sateliko-chatbot">
  <div id="sateliko-button" title="Chat with Sateliko">
    <div id="sateliko-avatar">
      <div class="satellite-body">
        <div class="antenna"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="mouth"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="sateliko-chat-window" class="hidden">
    <div id="sateliko-header">
      <span>Sateliko AI Chatbot</span>
      <button id="sateliko-close" aria-label="Close chat window">&times;</button>
    </div>
    <div id="sateliko-messages"></div>
    <form id="sateliko-form">
      <input type="text" id="sateliko-input" placeholder="Ask me about SatelliteForge..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>
</div>
